[project]
name = "specgraph-foundry"
version = "1.0.0"
description = "Source-authority compiler and execution-DAG platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Michael Alonzo Ware"}
]
dependencies = [
  "pypdf==4.3.1",
  "fpdf2==2.7.9",
  # pypdf and fpdf2 both import `cryptography` at module load for optional
  # PDF encryption. Without a working `_cffi_backend` that import does not
  # raise a normal ImportError - it panics inside pyo3 and deadlocks the
  # process, which turns every PDF test into a hang rather than a failure.
  "cffi>=1.16",
]

[project.scripts]
specgraph = "specgraph_foundry.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
