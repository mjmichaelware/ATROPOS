# Properties for the standalone Android build.
#
# app/ is its own Gradle build, so it does not inherit the repository root's
# gradle.properties. Without this file the AndroidX check fails during
# :checkReleaseAarMetadata with "contains AndroidX dependencies, but the
# android.useAndroidX property is not enabled" — the androidx.core /
# androidx.appcompat dependencies in app/build.gradle.kts require it.
android.useAndroidX=true

# AGP 8 default. Stated explicitly so the generated R class stays
# non-transitive regardless of which AGP version resolves.
android.nonTransitiveRClass=true

# CI runners are memory-constrained and an OOM during dexing surfaces as an
# unrelated-looking crash. Kept modest and explicit.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=true
