name: Build and Sign Android APK

# The APK is built from the standalone Gradle build under app/, not from the
# engine build at the repository root. `-p app` selects it. Keeping them
# separate means the engine never has to resolve the Android Gradle Plugin,
# and this job never has to configure the engine.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # AGP 8.2 targets JDK 17. The runner default has moved past that, and a
      # mismatch here surfaces as an opaque Kotlin/AGP failure rather than a
      # version error, so it is pinned.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Fail loudly and early if the wrapper is ever unpinned again. Gradle 9
      # removed org.gradle.api.internal.HasConvention, which the Kotlin Android
      # plugin still uses, so a runner defaulting to Gradle 9 crashes this build
      # during initialization with no obvious cause.
      - name: Verify Gradle version is pinned below 9
        run: |
          set -eu
          url="$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"
          echo "wrapper: $url"
          case "$url" in
            *gradle-9*) echo "::error::Gradle 9 is incompatible with the Kotlin Android plugin"; exit 1 ;;
          esac

      # Permanent release signing is optional for CI compilation. These
      # credentials belong to the operator's release-signing setup; their
      # absence must never prevent the application from being built and
      # inspected remotely. Values are never echoed.
      - name: Detect optional permanent signing credentials
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KS_B64" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Permanent signing credentials detected; CI will produce a signed artifact after the build."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Permanent signing credentials are not configured; CI will publish the verified unsigned build artifact."
          fi

      # Release, not debug. Modern Android refuses debug-signed APKs through the
      # GUI installer, which is why installation kept failing even after the
      # package identity was made unique.
      #
      # `-p app` is required: app/ is a standalone Gradle build, so the root
      # project has no assembleRelease task to run.
      - name: Build Release APK (unsigned)
        run: ./gradlew -p app assembleRelease --no-daemon --stacktrace

      - name: Show build outputs
        run: |
          set -eu
          echo "APK outputs:"
          find app/build/outputs/apk -name '*.apk' -print -exec ls -la {} \;

      # Published even when signing later fails, so a green build always yields
      # something inspectable. This cannot be installed as-is — an unsigned APK
      # is rejected by every installer — but it can be signed locally with
      # apksigner, and it proves what the build actually produced.
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: atropos-android-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Validate the compiled application independently of signing. This keeps
      # the build gate useful when permanent release credentials are intentionally
      # absent while still proving that the APK is not an empty shell.
      - name: Verify unsigned APK contains compiled application
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          "$aapt" dump badging "$apk" > badging.txt
          grep -q "package: name=" badging.txt
          grep -q "launchable-activity" badging.txt
          unzip -l "$apk" > contents.txt
          grep -q "classes.dex" contents.txt
          grep -q "resources.arsc" contents.txt
          echo "APK_BUILD_VERIFIED_OK"

      - name: Verify optional signing credentials
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          trap 'rm -f /tmp/ks.jks' EXIT
          printf '%s' "$KS_B64" | base64 -d > /tmp/ks.jks 2>/dev/null || {
            echo "::error::ANDROID_KEYSTORE_B64 is not valid base64"; exit 1; }
          size=$(stat -c%s /tmp/ks.jks)
          [ "$size" -gt 100 ] || { echo "::error::decoded keystore is too small to be real"; exit 1; }
          keytool -list -keystore /tmp/ks.jks -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1 || {
            echo "::error::keystore will not open with the supplied alias/password"; exit 1; }
          echo "optional permanent signing credentials verified"

      - name: Sign APK with Permanent Key
        if: steps.signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # Proves the artifact is a real application before it ever reaches a
      # device: a valid package name, a version, and a launchable activity.
      # The previous "empty shell" APK would have failed every one of these.
      - name: Verify the signed APK is installable
        if: steps.signing.outputs.available == 'true'
        run: |
          set -eu
          apk="${{ steps.sign_app.outputs.signedReleaseFile }}"
          echo "verifying: $apk"
          test -f "$apk" || { echo "::error::no signed APK produced"; exit 1; }

          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          echo "--- badging ---"
          "$aapt" dump badging "$apk" > badging.txt || true
          head -20 badging.txt

          grep -q "package: name=" badging.txt || { echo "::error::APK has no package identity"; exit 1; }
          grep -q "launchable-activity" badging.txt || { echo "::error::APK declares no launcher activity — the installer will reject it"; exit 1; }

          echo "--- contents ---"
          unzip -l "$apk" > contents.txt
          grep -q "classes.dex" contents.txt || { echo "::error::APK contains no compiled code (classes.dex missing)"; exit 1; }
          grep -q "resources.arsc" contents.txt || { echo "::error::APK has no resource table"; exit 1; }
          echo "APK_VERIFIED_OK"

      # Stable artifact name. A dynamic name is what broke the download script:
      # it searched for a fixed pattern that never matched.
      - name: Upload Signed APK Artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atropos-android-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Report unsigned-only CI result
        if: steps.signing.outputs.available != 'true'
        run: echo "Unsigned APK build is complete; permanent signing was intentionally skipped."
