name: android-apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/atropos-android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK (standalone android project)
        working-directory: apps/atropos-android
        run: |
          gradle wrapper --gradle-version 8.11.1 || true
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atropos-android-debug
          path: apps/atropos-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
