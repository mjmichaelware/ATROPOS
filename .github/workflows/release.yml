# Publishes the jar so a device that cannot build it can still run it.
#
# The engine is a 967-file Kotlin tree. Compiling it needs more heap than an
# aarch64 phone has spare -- the target device this is built for reports 876 MiB
# available against a 512 MiB default heap, and the compile dies in frontend
# analysis. A runner has ~16 GB and no such problem, so the jar is built here
# once and downloaded there.
#
# Two kinds of release, because they answer different questions:
#
#   latest  -- a moving tag rebuilt on every push to main. "What is on main
#              right now." This is what install.sh pulls, so a device is never
#              more than one push behind.
#   v*      -- a fixed tag, built once and never moved. "What was shipped."
#              This is what a README pins to and what a bug report cites.
#
# Factory CI already builds the jar on every push; it does not publish one.
# This does not duplicate that check -- it produces the artifact.
name: Release JAR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The moving `latest` tag is rewritten on every push to main, so two runs
# racing would leave the release pointing at whichever finished last rather
# than whichever is newest. One at a time, newest wins.
concurrency:
  group: release-jar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Dependency caching, which this job did not have.
      #
      # `clean` removes build outputs, not the Gradle dependency cache, so this
      # takes nothing away from the reproducibility contract below -- it stops
      # every release re-downloading the whole dependency graph from Maven
      # Central. A release build failed outright on `Received status code 429
      # from server: Too Many Requests` while resolving the Kotlin plugin BOM,
      # which published no jar for that commit and left `latest` pointing at an
      # older build with no indication anything was wrong.
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify clean runner contract
        run: bash scripts/github-actions-clean-runner.sh

      - name: Exercise clean runner contract test
        run: bash scripts/github-actions-clean-runner-test.sh

      # Retried only for transient network failures, and only those.
      #
      # A blanket retry would also re-run a genuine compile error three times
      # and take three times as long to tell the truth, so the loop inspects
      # the log and gives up immediately on anything that is not a rate limit,
      # a timeout, or a reset connection.
      - name: Build the jar
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon clean jar --max-workers=1 2>&1 | tee /tmp/build.log; then
              exit 0
            fi
            if ! grep -qiE "429|Too Many Requests|Connection reset|Read timed out|timeout" /tmp/build.log; then
              echo "build failed for a reason that will not fix itself; not retrying"
              exit 1
            fi
            echo "transient network failure on attempt $attempt; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "the dependency host stayed unreachable across three attempts"
          exit 1

      - name: Exercise installer packaging contract
        run: bash scripts/package-installers-test.sh

      - name: Exercise first-run installer contract
        run: bash scripts/install-contract-test.sh

      - name: Exercise installer release asset contract
        run: bash scripts/release-installer-contract-test.sh

      - name: Exercise npm installer contract
        run: bash scripts/npm-installer-contract-test.sh

      - name: Exercise provider environment contract
        run: bash scripts/provider-env-contract-test.sh

      - name: Exercise backend atom source contract
        run: bash scripts/backend-atom-contract-test.sh

      - name: Package install artifacts
        run: bash scripts/package-installers.sh build/libs/ATROPOS.jar build/installers

      - name: Record the hash
        id: hash
        run: |
          set -euo pipefail
          sha256sum build/libs/ATROPOS.jar | awk '{print $1}' > build/libs/ATROPOS.jar.sha256
          echo "sha256=$(cat build/libs/ATROPOS.jar.sha256)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A jar that cannot start is not a release. This is the same check the
      # engine answers for its own health, so a broken build is caught here
      # rather than on the operator's phone.
      - name: Prove the jar runs
        run: |
          set -euo pipefail
          java -jar build/libs/ATROPOS.jar --health | tee /tmp/health.txt
          grep -q ATROPOS_HEALTHY /tmp/health.txt

      - name: Publish the rolling build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Rolling build (${{ steps.hash.outputs.commit }})"
          # Marked prerelease so `releases/latest` keeps pointing at the newest
          # *tagged* version for anyone who wants stability, while this URL
          # stays available for anyone who wants current.
          prerelease: true
          body: |
            Built from `${{ steps.hash.outputs.commit }}` on main.

            sha256: `${{ steps.hash.outputs.sha256 }}`

            Rebuilt on every push. For a fixed version, use a `v*` release.
          files: |
            build/libs/ATROPOS.jar
            build/libs/ATROPOS.jar.sha256
            build/installers/**

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Built from `${{ steps.hash.outputs.commit }}`.

            sha256: `${{ steps.hash.outputs.sha256 }}`
          files: |
            build/libs/ATROPOS.jar
            build/libs/ATROPOS.jar.sha256
            build/installers/**

  # The npm package is a thin launcher around the same published JAR. Publish
  # it only for immutable version tags; rolling `latest` releases must not
  # republish the same npm version. A missing NPM_TOKEN skips this optional
  # channel rather than changing the JAR release result.
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - name: Align npm version with release tag
        working-directory: npm
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Publish npm launcher
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm
        run: npm publish --access public --provenance

  # The Android client, as an installable APK.
  #
  # A separate job on purpose: app/ is a standalone Gradle build that resolves
  # the Android Gradle Plugin, and the jar release must not wait on -- or be
  # blocked by -- Android tooling. `continue-on-error` keeps a broken APK from
  # holding back a good engine build; the jar is the product, the APK is a
  # client of it.
  #
  # `assembleDebug`, not `assembleRelease`. The release build type sets
  # `signingConfig = null`, so it produces an unsigned APK that Android refuses
  # to install -- publishing one would be shipping a file that cannot be used.
  # The debug build is signed with the standard debug key and installs on any
  # device with "install unknown apps" enabled. A signed release APK needs the
  # operator's keystore, which is a secret this workflow deliberately does not
  # hold.
  apk:
    # Both jobs publish assets to the same release tag. Serialize this
    # optional client publication behind the canonical JAR release so two
    # release writers cannot race while creating or updating the tag.
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        run: ./gradlew --no-daemon -p app assembleDebug --max-workers=1

      - name: Name it, and record the hash
        id: apk
        run: |
          set -euo pipefail
          built=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$built"
          mkdir -p build/apk
          cp "$built" build/apk/ATROPOS.apk
          sha256sum build/apk/ATROPOS.apk | awk '{print $1}' > build/apk/ATROPOS.apk.sha256
          echo "sha256=$(cat build/apk/ATROPOS.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Publish it alongside the jar
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: |
            build/apk/ATROPOS.apk
            build/apk/ATROPOS.apk.sha256

      - name: Publish it on the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/ATROPOS.apk
            build/apk/ATROPOS.apk.sha256
