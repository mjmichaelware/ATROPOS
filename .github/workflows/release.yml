name: Release JAR
'on':
  push:
    branches:
    - main
    tags:
    - v*
  workflow_dispatch: {}
concurrency:
  group: release-jar
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      commit: ${{ steps.hash.outputs.commit }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install ripgrep
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Clear Gradle cache
      run: rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists/gradle-8.4-bin
    - name: Verify clean runner contract
      run: bash scripts/github-actions-clean-runner.sh
    - name: Exercise clean runner contract test
      run: bash scripts/github-actions-clean-runner-test.sh
    - name: Build the jar
      run: "set -uo pipefail\nfor attempt in 1 2 3; do\n  if ./gradlew --no-daemon --no-build-cache --no-configuration-cache\
        \ clean jar --max-workers=1 2>&1 | tee /tmp/build.log; then\n    exit 0\n  fi\n  if ! grep -qiE \"429|Too Many Requests|Connection\
        \ reset|Read timed out|timeout\" /tmp/build.log; then\n    echo \"build failed for a reason that will not fix itself;\
        \ not retrying\"\n    exit 1\n  fi\n  echo \"transient network failure on attempt $attempt; retrying in $((attempt\
        \ * 30))s\"\n  sleep $((attempt * 30))\ndone\n  echo \"the dependency host stayed unreachable across three attempts\"\
        \n  exit 1"
    - name: Exercise installer packaging contract
      run: bash scripts/package-installers-test.sh
    - name: Exercise first-run installer contract
      run: bash scripts/install-contract-test.sh
    - name: Hash the jar
      id: hash
      run: 'set -euo pipefail

        jar=build/libs/ATROPOS.jar

        test -f "$jar"

        sha256sum "$jar" | awk ''{print $1}'' > "$jar.sha256"

        sha256=$(cat "$jar.sha256")

        commit=$(git rev-parse --short HEAD)

        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

        echo "commit=$commit" >> "$GITHUB_OUTPUT"'
    - name: Publish JAR with gh release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        tag="${GITHUB_REF_NAME}"

        jar="build/libs/ATROPOS.jar"

        sha256="${{ steps.hash.outputs.sha256 }}"

        commit="${{ steps.hash.outputs.commit }}"

        gh release create "$tag" --title "ATROPOS $tag" --notes "Built from \`${commit}`.


        sha256: \`${sha256}\`" "$jar" "$jar.sha256" --prerelease=false'
    - name: Publish rolling latest (main branch only)
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        jar="build/libs/ATROPOS.jar"

        sha256="${{ steps.hash.outputs.sha256 }}"

        commit="${{ steps.hash.outputs.commit }}"

        gh release delete latest --yes --cleanup-tag || true

        gh release create latest --title "ATROPOS latest (rolling)" --notes "Rolling build from \`${commit}`.


        sha256: \`${{ steps.hash.outputs.sha256 }}\`" "$jar" "$jar.sha256" --prerelease=true'
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: https://registry.npmjs.org
    - name: Align npm version with release tag
      working-directory: npm
      run: npm pkg set version="${GITHUB_REF_NAME#v}"
    - name: Publish npm launcher
      if: env.NODE_AUTH_TOKEN != ''
      working-directory: npm
      run: npm publish --access public --provenance
  apk:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Build the APK
      run: ./gradlew --no-daemon -p app assembleDebug --max-workers=1
    - name: Name it, and record the hash
      id: apk
      run: 'set -euo pipefail

        built=$(find app/build/outputs/apk -name ''*.apk'' | head -1)

        test -n "$built"

        mkdir -p build/apk

        cp "$built" build/apk/ATROPOS.apk

        sha256sum build/apk/ATROPOS.apk | awk ''{print $1}'' > build/apk/ATROPOS.apk.sha256

        echo "sha256=$(cat build/apk/ATROPOS.apk.sha256)" >> "$GITHUB_OUTPUT"'
    - name: Publish it alongside the jar
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        gh release upload latest build/apk/ATROPOS.apk build/apk/ATROPOS.apk.sha256 --clobber || true'
    - name: Publish it on the tagged release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        gh release upload "${{ github.ref_name }}" build/apk/ATROPOS.apk build/apk/ATROPOS.apk.sha256 --clobber'
