# The compile gate, run on GitHub's hardware.
#
# ATROPOS runs on a phone, where `./gradlew compileKotlin` exits 127 -- there is
# no JDK toolchain to run it. A self-host run there mutates source, cannot
# compile it, and correctly refuses to promote anything, which leaves the engine
# unable to finish its own loop on the only machine its operator has.
#
# This workflow is the other half of GitHubActionsCompileRunner: the engine
# pushes a snapshot of the mutated tree to a scratch ref and dispatches this,
# then reads the conclusion as the gate's exit code. Nothing here decides
# anything the local gate would not have decided -- it is the same command, on a
# machine that can run it.
name: compile gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: Who asked for this compile, and for what
        required: false
        default: manual

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Keep production and test compilation in the hosted lane. The local
      # phone lane remains allowed to use the same command through its remote
      # compile gate when the device cannot finish Gradle in its heap budget.
      - name: compileKotlin
        run: ./gradlew --no-daemon compileJava compileTestJava compileKotlin compileTestKotlin

  focused-backend-tests:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: reject newly orphaned production files
        run: python3 scripts/find-orphans.py --fail-on-new

      - name: npm installer contract
        run: bash scripts/npm-installer-contract-test.sh

      - name: reusable verify action contract
        run: bash scripts/atropos-verify-action-contract-test.sh

      - name: focused factory provider bridge MCP tests
        run: >-
          ./gradlew --no-daemon :test --rerun
          --tests 'atropos.core.factory.FactoryResumeAndRepairTest'
          --tests 'atropos.core.factory.FactoryLiveRepairActionTest'
          --tests 'atropos.core.factory.FactoryProgressGuardTest'
          --tests 'atropos.core.factory.FactoryRunHandoffTest'
          --tests 'atropos.core.factory.FactoryObligationLoopTest'
          --tests 'atropos.core.factory.FactoryAcceptanceFreezeTest'
          --tests 'atropos.core.factory.FactoryEvidenceWaveExecutorTest'
          --tests 'atropos.core.factory.FactoryResearchDloiTest'
          --tests 'atropos.core.provider.ProviderOnboardingTest'
          --tests 'atropos.core.provider.ProviderCascadeRouterTest'
          --tests 'atropos.core.policy.ProviderActionProposalsTest'
          --tests 'atropos.core.provider.QuotaLedgerRouteTruthTest'
          --tests 'atropos.bridge.BridgeEventsHandlerTest'
          --tests 'atropos.bridge.BridgeEvidenceHandlerTest'
          --tests 'atropos.bridge.BridgeApprovalHandlerTest'
          --tests 'atropos.bridge.BridgeMcpHandlerTest'
          --tests 'atropos.core.integration.McpHostManagerTest'
          --tests 'atropos.core.integration.InboundToolBridgeTest'
          --tests 'atropos.core.integration.MarkItDownIngestServiceTest'
          --tests 'atropos.bridge.BridgeQuotaRouteTest'
          --tests 'atropos.bridge.RecoveryProjectionTest'
          --tests 'atropos.bridge.BridgeFilesHandlerTest'
          --tests 'atropos.cli.BackendDoctorTest'
          --tests 'atropos.cli.input.CommandCatalogBackendEntriesTest'
          --tests 'atropos.core.agent.AgentContextCollectorTest'
          --tests 'atropos.cli.shell.ShellBoundedAgencyTest'
          --tests 'atropos.core.worktree.BoundedGitWorktreeCommandRunnerTest'
          --tests 'atropos.core.verification.GateReachabilityCheckerTest'
          --tests 'atropos.core.github.GitHubApiClientTest'
          --tests 'atropos.core.scavenge.GitHubScavengerTest'

      - name: validate MCP example catalog
        run: bash scripts/mcp-example-contract-test.sh
