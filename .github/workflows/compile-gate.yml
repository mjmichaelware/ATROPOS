# The compile gate, run on your self-hosted hardware to bypass minute quotas.
name: compile gate

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      reason:
        description: Who asked for this compile, and for what
        required: false
        default: manual

permissions:
  contents: read
  actions: write # Required for GitHub CLI cache deletion

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Clean redundant GitHub caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Sweeping redundant 20 MiB Gradle home fragments and Java installations..."
          gh cache list --json key -q '.[].key' | grep -iE 'gradle|java' | while read -r key; do
            gh cache delete "$key" || true
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: Clean Gradle cache
        run: ./gradlew --no-daemon clean

      - name: compileKotlin
        env:
          GRADLE_OPTS: -Xmx4g
        run: |
          ./gradlew --no-daemon compileJava compileKotlin -Pkotlin.compiler.maxErrors=10000 -Dorg.jetbrains.kotlin.compiler.maxErrors=10000 --info --stacktrace --console=plain 2>&1 | tee compile.log
        timeout-minutes: 25

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-log
          path: compile.log
          retention-days: 3
